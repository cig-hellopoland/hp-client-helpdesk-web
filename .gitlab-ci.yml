Deploy Hello Poland Production Environment:
  stage: deploy
  dependencies: []
  only:
    - master
    - merge-requests
    - web
  allow_failure: false
  variables:
    GIT_STRATEGY: none
  script:
    - DOCKER_IMAGE_REF="$(docker images ${DOCKER_IMAGE} --format "{{.ID}}")" # references previously built image
    - echo "Deploying ${CI_COMMIT_REF_NAME} from ${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}"
    - docker pull "${DOCKER_IMAGE}"
    - echo "Removing old container..." && docker ps -aq --filter "name=${DOCKER_CONTAINER_NAME}" | grep -q . && docker stop ${DOCKER_CONTAINER_NAME} && docker container rm ${DOCKER_CONTAINER_NAME}
#    - echo "Removing old image..." && [[ ${DOCKER_IMAGE_REF} && ${DOCKER_IMAGE_REF} != $(docker images ${DOCKER_IMAGE} --format "{{.ID}}") ]] && docker image rm ${DOCKER_IMAGE_REF}
#    - docker ps -aq --filter "name=${DOCKER_CONTAINER_NAME}" | grep -q . && docker stop "${DOCKER_CONTAINER_NAME}" && docker rm "${DOCKER_CONTAINER_NAME}"
#    - docker run -d -v ${FRM_PRODUCTION_VOLUME}:/data -p ${FRM_PRODUCTION_PORT}:3000 --restart "${FRM_PRODUCTION_RESTART_POLICY}" --name "${FRM_PRODUCTION_CONTAINER_NAME}" "${FRM_DOCKER_IMAGE}"
    - docker run -d -v ${CICD_DOCKER_VOLUME}:/data -p ${CICD_DOCKER_PORT}:3000 --restart ${CICD_DOCKER_RESTART_POLICY} --name ${DOCKER_CONTAINER_NAME} ${DOCKER_IMAGE}
    - echo "Deployed as ${DOCKER_CONTAINER_NAME}"
  tags:
    - hpl-prod
  when: manual
  environment:
    name: Hello Poland Production Environment
    url: https://${CICD_ENVIRONMENT_URL}

