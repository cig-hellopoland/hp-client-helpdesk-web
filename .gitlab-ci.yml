#
# CI/CD for web applications
# Revision: 2
# See README.md for detailed description.
#

stages:
  - prepare
  - unit tests
  - build
  - docker
  - deploy
  - cleanup

variables:
  ARTIFACT_PREFIX: "${CI_PROJECT_NAME}_${CI_COMMIT_SHORT_SHA}-${CI_PIPELINE_ID}"
  CICD_DEST_DIR: "${CICD_DIST_DIR:-.next}"
  CICD_DOCKER_PORT: "127.0.0.1:3000"
  CICD_DOCKER_RESTART_POLICY: "unless-stopped"
  CICD_DOCKER_VOLUME: ""
  CICD_NODE_VERSION: "10"
  CICD_DOCKER_WORKDIR_NODE: "/home/node/app"
  DOCKER_CONTAINER_NAME: '${CI_PROJECT_PATH_SLUG}'
  DOCKER_IMAGE: "${CICD_REGISTRY_DOCKER}${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_REF_SLUG}"
  DOCKER_IMAGE_RELEASE: "${CICD_REGISTRY_DOCKER}${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_REF_SLUG}-release"
  DOCKER_IMAGE_SNAPSHOT: "${CICD_REGISTRY_DOCKER}${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAME}:${CI_COMMIT_REF_SLUG}-snapshot"
  PCRE_NODE_ENGINE: '.*\"node\":\s\"(.*)\".*' # matches line with node version in the "engine" section of package.json
  PCRE_SEMVER: '(?P<major>0|[1-9]\d*)\.(?P<minor>0|[1-9]\d*)\.(?P<patch>0|[1-9]\d*)(?:-(?P<prerelease>(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+(?P<buildmetadata>[0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?'

before_script:
  - DOCKER_CONTAINER_NAME="${DOCKER_CONTAINER_NAME//-/_}" # replace dash with underscore for easier selection in the console

#
# prepare stage jobs
#
snapshot image:
  stage: prepare
  only:
    - merge_requests
    - tags
    - web
  tags:
    - shell-executor
  script:
    - NODE_VERSION="$(grep -P ${PCRE_NODE_ENGINE} package.json | grep -P -o ${PCRE_SEMVER})" || true # "grep -P" not supported on macOS so falling back to CICD_NODE_VERSION
    - NODE_IMAGE_VERSION="${NODE_VERSION:-$CICD_NODE_VERSION}-alpine"
    - CICD_NPMRC="${CICD_NPMRC:-$HOME/.npmrc}"
    - DOCKER_IMAGE_SNAPSHOT_REF="$(docker images ${DOCKER_IMAGE_SNAPSHOT} --format "{{.ID}}")" # references previously built image
    - echo "Building snapshot image using node:${NODE_IMAGE_VERSION} with .npmrc from ${CICD_NPMRC}"
    - DOCKER_BUILDKIT=1 docker build -t ${DOCKER_IMAGE_SNAPSHOT} -f Dockerfile.snapshot --build-arg NODE_VERSION=${NODE_IMAGE_VERSION} --secret id=npmrc,src=${CICD_NPMRC} --progress=plain .
    - echo "Removing old image..." && [[ ${DOCKER_IMAGE_SNAPSHOT_REF} && ${DOCKER_IMAGE_SNAPSHOT_REF} != $(docker images ${DOCKER_IMAGE_SNAPSHOT} --format "{{.ID}}") ]] && docker image rm ${DOCKER_IMAGE_SNAPSHOT_REF}
    - docker push ${DOCKER_IMAGE_SNAPSHOT}

baseline_node image:
  stage: prepare
  only:
    - merge_requests
    - tags
    - web
  tags:
    - shell-executor
  variables:
    BUILD_TYPE: "baseline_node"
  script:
    - NODE_VERSION="$(grep -P ${PCRE_NODE_ENGINE} package.json | grep -P -o ${PCRE_SEMVER})" || true # "grep -P" not supported on macOS so falling back to CICD_NODE_VERSION
    - NODE_IMAGE_VERSION="${NODE_VERSION:-$CICD_NODE_VERSION}-alpine"
    - CICD_NPMRC="${CICD_NPMRC:-$HOME/.npmrc}"
    - DOCKER_IMAGE_RELEASE_REF="$(docker images ${DOCKER_IMAGE_RELEASE} --format "{{.ID}}")" # references previously built image
    - echo "Building ${BUILD_TYPE} image using node:${NODE_IMAGE_VERSION} with .npmrc from ${CICD_NPMRC}"
    - DOCKER_BUILDKIT=1 docker build -t ${DOCKER_IMAGE_RELEASE} -f Dockerfile.release --build-arg BUILD_TYPE=${BUILD_TYPE} --build-arg NODE_VERSION=${NODE_IMAGE_VERSION} --secret id=npmrc,src=${CICD_NPMRC} --progress=plain .
    - echo "Removing old image..." && [[ ${DOCKER_IMAGE_RELEASE_REF} && ${DOCKER_IMAGE_RELEASE_REF} != $(docker images ${DOCKER_IMAGE_RELEASE} --format "{{.ID}}") ]] && docker image rm ${DOCKER_IMAGE_RELEASE_REF}
    - docker push ${DOCKER_IMAGE_RELEASE}


#
# unit tests stage jobs
#
audit:
  stage: unit tests
  needs:
    - snapshot image
  only:
    - merge_requests
    - tags
    - web
  tags:
    - docker-executor
  allow_failure: true
  image: ${DOCKER_IMAGE_SNAPSHOT}
  variables:
    GIT_STRATEGY: none
  script:
    - cd ${CICD_DOCKER_WORKDIR_NODE}
    - npm audit

linter:
  stage: unit tests
  needs:
    - snapshot image
  only:
    - merge_requests
    - tags
    - web
  tags:
    - docker-executor
  image: ${DOCKER_IMAGE_SNAPSHOT}
  variables:
    GIT_STRATEGY: none
  script:
    - cd ${CICD_DOCKER_WORKDIR_NODE}
    - npm run lint

