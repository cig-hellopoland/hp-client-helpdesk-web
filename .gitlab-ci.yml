stages:
  - test
  - build

variables:
  NODE_VERSION: "8"

#
# test stage tasks
#
test_project:
  stage: test
  before_script:
    - . envcfg
    - npm i
  script:
    - npm run lint
    - npm run test


#
# build stage tasks
#
build_project:
  stage: build
  variables:
#  artifacts:
#    name: "$CI_PROJECT_NAMESPACE_$CI_PROJECT_NAME-$CI_PIPELINE_ID"
#    paths:
#      - dist/
  before_script:
    - . envcfg
    - npm i
  script:
    - npm run build
