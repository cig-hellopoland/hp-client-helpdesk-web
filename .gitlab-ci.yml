#
# build stage jobs
#
build dist:
  stage: build
  needs:
    - snapshot image
  only:
    - merge_requests
    - tags
    - web
  tags:
    - docker-executor
  image: ${DOCKER_IMAGE_SNAPSHOT}
  artifacts:
    name: "${ARTIFACT_PREFIX}-dist"
    expire_in: 60 mins
    paths:
      - ${CICD_DIST_DIR}
  script:
    - BUILD_DIR="$(pwd)"
    - cd ${CICD_DOCKER_WORKDIR_NODE}
    - NODE_ENV="production" npm run build
    - echo "CICD_DIST_DIR=${CICD_DIST_DIR}"
    - echo "BUILD_DIR=${BUILD_DIR}"
    - echo "CICD_DOCKER_WORKDIR_NODE=${CICD_DOCKER_WORKDIR_NODE}"
    - echo "BUILD_DIR=${BUILD_DIR}"
    - mv ${CICD_DIST_DIR} ${BUILD_DIR}



